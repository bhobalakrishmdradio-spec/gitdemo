<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SlideCast</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SlideCast">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1226">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #eef0ff;
    background: radial-gradient(circle at 20% 0%, #2a1f55, #0f1226 55%);
  }
  form { width: 100%; max-width: 360px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { margin: 12px 0 4px; font-size: 1.8rem; }
  h1 span { color: #ffc43d; }
  p { color: #9aa0c8; margin: 0 0 24px; }
  input {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #2c3263; background: #20254a;
    color: #eef0ff; font: inherit; font-size: 17px; /* 16px+ stops iOS zooming in */
  }
  button {
    width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px;
    background: #ffc43d; color: #1a1a26; font: 600 17px system-ui, sans-serif; cursor: pointer;
  }
  .err { color: #ff6b6b; min-height: 1.5em; margin-top: 12px; }
</style>
</head>
<body>
<form id="f">
  <img src="/icons/icon-180.png" alt="">
  <h1>Slide<span>Cast</span></h1>
  <p>Private · sign in to continue</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button>Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }),
    });
    if (r.ok) return location.replace("/");
    err.textContent = (await r.json()).detail || "Sign-in failed";
  } catch {
    err.textContent = "Can't reach your Mac.";
  }
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
